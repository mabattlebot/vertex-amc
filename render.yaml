services:
  - type: web
    name: vertex
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # you paste the key in Render's dashboard; it is never stored in this repo
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false        # optional backup; used only if GEMINI_API_KEY is missing or a Gemini call fails
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ALLOWED_ORIGINS
        value: https://mabattlebot.github.io   # lets the GitHub Pages copy of the site use this AI backend
      - key: SUPABASE_URL
        value: https://qruwzwcxzjhqxdiotyvg.supabase.co   # AI requests must come from a signed-in user of this project
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_X-Dw7_8ZxIRzmmaU2FsJjA_7WAI4WZ4   # public key, used only to check sign-in tokens
      - key: SUPABASE_SECRET_KEY
        sync: false        # secret; lets the server save generated lessons in the lessons table so each is written only once
